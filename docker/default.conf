# Define rate limits
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;        # General API rate limit
# /api/login throttle. 30 per minute with burst 10 (see location block
# below) — the e2e suite issues 3 logins per run (1 setup + 2 auth smoke
# tests), and we want headroom for accidental retries without making
# brute-force trivially cheap. Do not raise without considering both the
# e2e budget and the attacker's effective rate.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=signup:10m rate=2r/m;      # Very strict signup rate limit
limit_req_zone $binary_remote_addr zone=search:10m rate=30r/s;     # Lenient search rate limit
limit_req_zone $binary_remote_addr zone=oauth:10m rate=30r/m;      # OAuth endpoints; authorize POST does credential auth

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Search endpoint with lenient rate limiting since requests are made as the user is typing
    location /api/search {
        limit_req zone=search burst=50 nodelay;  # Large burst for typing
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login endpoint with strict rate limiting
    location /api/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signup endpoint with very strict rate limiting
    location /api/signup {
        limit_req zone=signup burst=1 nodelay;  # Almost no burst allowed
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API endpoints with more lenient rate limiting
    location /api/ {
        client_max_body_size 50M;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MCP integration (enabled at runtime via System Settings; the API returns
    #     404 on these paths while the MCP server is disabled) ---

    # OAuth 2.0 discovery documents (RFC 8414 / RFC 9728) must be served from
    # well-known root paths so MCP clients such as Claude can find them.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth registration, authorize (login), and token endpoints. Strict rate
    # limiting because the authorize POST authenticates user credentials.
    location /oauth/ {
        limit_req zone=oauth burst=10 nodelay;
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable HTTP endpoint. Buffering is disabled and the read timeout
    # raised so long-lived SSE response streams flush promptly and stay open.
    location /mcp {
        client_max_body_size 50M;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        client_max_body_size 50M;
        try_files $uri $uri/ /index.html;
    }
}
