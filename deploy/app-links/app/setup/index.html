<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Set up Receipt Wrangler on your phone</title>
  <style>
    :root {
      --bg: #f0f9ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #27b1ff;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #131c2e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --brand: #27b1ff;
        --border: #223049;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(39, 177, 255, 0.12);
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .server {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 0 0 24px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .server strong { display: block; color: var(--text); margin-bottom: 4px; }
    .server code { color: var(--brand); }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .store-btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #27b1ff 0%, #009efa 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .store-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39, 177, 255, 0.4); }
    .hint { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set up Receipt Wrangler</h1>
    <p>Install the mobile app to connect it to your Receipt Wrangler server.</p>

    <div class="server" id="server">
      <strong>Your server</strong>
      <code id="server-url"></code>
    </div>

    <div class="stores">
      <!-- Play Store link is deterministic from the applicationId. -->
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=io.receiptwrangler">
        Get it on Google Play
      </a>
      <!-- TODO: replace id0000000000 with the real numeric App Store ID for io.receiptwrangler. -->
      <a class="store-btn" href="https://apps.apple.com/app/id0000000000">
        Download on the App Store
      </a>
    </div>

    <p class="hint">
      Already have the app? Open it and scan the QR code on the login page again, or paste your
      server URL into the "Connect to Server" screen.
    </p>
  </div>

  <script>
    // The server URL rides in the URL fragment (#url=...) so it never reaches
    // this server's logs. Read it client-side and show it for confirmation.
    (function () {
      try {
        var hash = window.location.hash.replace(/^#/, "");
        var params = new URLSearchParams(hash);
        var url = params.get("url");
        if (url) {
          document.getElementById("server-url").textContent = url;
          document.getElementById("server").style.display = "block";
        }
      } catch (e) {
        // Ignore a malformed fragment; the store links still work.
      }
    })();
  </script>
</body>
</html>
