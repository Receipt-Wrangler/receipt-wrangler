buildscript {
    // The Kotlin Gradle plugin version is managed in settings.gradle's
    // pluginManagement plugins block (org.jetbrains.kotlin.android), matching the
    // modern Flutter Android template, so it is not declared on the legacy
    // buildscript classpath here (declaring it in both places conflicts with
    // "plugin already on the classpath with an unknown version").
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some Flutter plugins (e.g. cunning_document_scanner 2.3.0) use the modern
// `kotlin { compilerOptions { ... } }` DSL in their android/build.gradle but do not
// apply the Kotlin Gradle plugin themselves. This app applies kotlin-android only to
// :app, so those plugin subprojects fail to evaluate with "Could not find method
// kotlin()". Apply kotlin-android to any Android-library subproject the moment it
// applies com.android.library, so the kotlin{} DSL resolves before it is referenced.
// Re-applying an already-applied plugin is a no-op, so this is safe for plugins that
// apply it themselves.
subprojects { sp ->
    sp.plugins.withId('com.android.library') {
        sp.apply plugin: 'org.jetbrains.kotlin.android'
    }
}

// sentry_flutter (8.14.2) pins Kotlin `languageVersion = "1.6"` in its
// android/build.gradle, which this project's Kotlin 2.2.x toolchain (bumped for
// cunning_document_scanner 2.3.0, see settings.gradle) rejects at compile time:
// "Language version 1.6 is no longer supported; please, use version 1.8 or
// greater". Force that one module's Kotlin compile tasks up to the supported
// floor. Scoped to sentry_flutter (via afterEvaluate, so it overrides the
// module's own kotlinOptions) so every other subproject keeps its own language
// version. If sentry_flutter is upgraded past the 1.6 pin, this block is a no-op
// and can be removed.
subprojects { sp ->
    if (sp.name == 'sentry_flutter') {
        sp.afterEvaluate {
            sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8)
                    apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8)
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
