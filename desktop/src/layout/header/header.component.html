@if (isLoggedIn()) {
  <div
    id="header-container"
    class="header-container d-flex justify-content-between align-items-center"
  >
    <div class="col d-flex align-items-center">
      <button
        mat-icon-button
        color="accent"
        class="nav-button"
        matTooltip="Toggle sidebar"
        aria-label="Toggle sidebar"
        data-testid="sidebar-toggle"
        (click)="toggleSidebar()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <button
        *hasGroupPermission="{ groupId: selectedGroupIdNumber(), permission: Permission.GroupDashboardsRead }"
        mat-icon-button
        color="accent"
        class="nav-button"
        matTooltip="Dashboard"
        routerLinkActive="active-link"
        [routerLink]="dashboardHeaderLink()"
      >
        <mat-icon>dashboard</mat-icon>
      </button>
      <button
        mat-icon-button
        color="accent"
        class="nav-button"
        matTooltip="Receipt List"
        data-testid="header-receipts-link"
        routerLinkActive="active-link"
        [routerLink]="receiptHeaderLink()"
      >
        <mat-icon>receipt_long</mat-icon>
      </button>
      @for (shortcut of userPreferences()?.userShortcuts ?? []; track shortcut["id"]) {
        <a [href]="shortcut.url">
          <button
            mat-icon-button
            color="accent"
            class="nav-button"
            routerLinkActive="active-link"
            [matTooltip]="shortcut.name"
          >
            <mat-icon>{{ shortcut.icon }}</mat-icon>
          </button>
        </a>
      }
    </div>
    <div class="col-auto d-flex align-items-center justify-content-end">
      <app-searchbar
        *hasAppPermission="Permission.AppReceiptsSearch"
        class="receipt-searchbar w-100 me-2"
      ></app-searchbar>
      <ng-container *hasAppPermission="Permission.AppNotificationsRead">
        <app-button
          cdkOverlayOrigin
          #notificationsOrigin="cdkOverlayOrigin"
          class="ms-4"
          data-testid="header-notifications-button"
          matButtonType="iconButton"
          icon="notifications"
          aria-haspopup="dialog"
          [attr.aria-expanded]="notificationsOpen()"
          [matBadgeContent]="notificationCount()"
          (clicked)="toggleNotifications()"
        ></app-button>

        <!--
          No backdrop: a click outside closes the panel AND still lands on what
          was clicked. Escape is handled by the overlay itself (it detaches).
        -->
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="notificationsOrigin"
          [cdkConnectedOverlayOpen]="notificationsOpen()"
          [cdkConnectedOverlayPositions]="notificationsPositions"
          (overlayKeydown)="onNotificationsKeydown($event)"
          (overlayOutsideClick)="closeNotifications()"
          (detach)="closeNotifications()"
        >
          <div
            #notificationsPanel
            class="notifications-panel"
            role="dialog"
            aria-label="Notifications"
            tabindex="-1"
            data-testid="header-notifications-panel"
            cdkTrapFocus
          >
            <span class="notifications-panel__arrow" aria-hidden="true"></span>
            <app-notifications-list (notificationCountChanged)="notificationCount.set($event)"></app-notifications-list>
          </div>
        </ng-template>
      </ng-container>

      <img
        class="mx-4"
        src="assets/branding/logo-large.svg"
      >
    </div>
  </div>
}
@if (showProgressBar()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<ng-template
  #navButton
  let-srcPath="srcPath"
  let-routerLink="routerLink"
  let-tooltip="tooltip"
>
  <button
    mat-icon-button
    color="accent"
    class="nav-button"
    [routerLink]="routerLink"
    [matTooltip]="tooltip"
  >
    <img [src]="srcPath"/>
  </button>
</ng-template>
