<app-dialog headerText="Some receipts could not be deleted">
  <p data-testid="bulk-delete-result-summary">
    Deleted {{ data.deletedCount }} of {{ data.requestedCount }} receipts.
  </p>
  <ul class="bulk-delete-result-failures" data-testid="bulk-delete-result-failures">
    @for (failure of data.failures; track $index) {
      <li>
        <strong>{{ failure.name }}</strong>: {{ failure.message }}
      </li>
    }
  </ul>
  <div class="d-flex justify-content-end mt-3">
    <app-button
      buttonText="Close"
      matButtonType="basic"
      (clicked)="close()"
    ></app-button>
  </div>
</app-dialog>
