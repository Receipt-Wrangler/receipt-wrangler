<app-dialog [headerText]="headerText">
  <ng-template [ngTemplateOutlet]="formTemplate"></ng-template>
</app-dialog>

<ng-template #formTemplate>
  <ng-template
    [ngTemplateOutlet]="filterField"
    [ngTemplateOutletContext]="{
      label: 'Type',
      fieldName: 'type',
      type: 'list',
      options: systemTaskTypeOptions,
      optionFilterKey: 'displayValue',
      optionDisplayKey: 'displayValue',
      optionValueKey: 'value',
      multiple: true
    }"
  ></ng-template>

  <ng-template
    [ngTemplateOutlet]="filterField"
    [ngTemplateOutletContext]="{
      label: 'Status',
      fieldName: 'status',
      type: 'list',
      options: systemTaskStatusOptions,
      optionFilterKey: 'displayValue',
      optionDisplayKey: 'displayValue',
      optionValueKey: 'value',
      multiple: true
    }"
  ></ng-template>

  <ng-template
    [ngTemplateOutlet]="filterField"
    [ngTemplateOutletContext]="{
      label: 'Ran by',
      fieldName: 'ranByUserId',
      type: 'users'
    }"
  ></ng-template>

  <ng-template
    [ngTemplateOutlet]="filterField"
    [ngTemplateOutletContext]="{
      label: 'Started At',
      fieldName: 'startedAt',
      type: 'date'
    }"
  ></ng-template>

  <ng-template
    [ngTemplateOutlet]="filterField"
    [ngTemplateOutletContext]="{
      label: 'Ended At',
      fieldName: 'endedAt',
      type: 'date'
    }"
  ></ng-template>

  <app-dialog-footer
    submitButtonTooltip="Apply filter"
    [additionalButtonsTemplate]="resetButton"
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</ng-template>

<ng-template
  #filterField
  let-label="label"
  let-fieldName="fieldName"
  let-type="type"
  let-options="options"
  let-optionFilterKey="optionFilterKey"
  let-multiple="multiple"
  let-optionDisplayKey="optionDisplayKey"
  let-optionValueKey="optionValueKey"
>
  <div class="d-flex">
    @if ((parentForm | formGet : fieldName + '.operation').value === FilterOperation.Between) {
      <div class="d-flex w-100">
        <div class="d-flex w-50 align-items-center">
          <div class="w-50">
            <app-datepicker
              *ngIf="type === 'date'"
              [label]="'Start ' + label"
              [inputFormControl]="parentForm | formGet : fieldName + '.value.0'"
              [additionalErrorMessages]="{
              'invalidValue': 'Start ' + label + ' is invalid.'
              }"
            >
            </app-datepicker>
          </div>
          <span class="between-separator">
            and
          </span>
          <div class="w-50">
            <app-datepicker
              *ngIf="type === 'date'"
              [label]="'End ' + label"
              [inputFormControl]="parentForm | formGet : fieldName + '.value.1'"
            >
            </app-datepicker>
          </div>
        </div>

        <div class="ms-2 w-50">
          <app-select
            label="Operation"
            [inputFormControl]="parentForm | formGet : fieldName + '.operation'"
            [options]="type | operations: false"
            [optionsDisplayArray]="type | operations: true"
            [addEmptyOption]="true"
          ></app-select>
        </div>
      </div>
    } @else if ((parentForm | formGet : fieldName + '.operation').value === FilterOperation.WithinCurrentMonth) {
      <div class="d-flex w-100">
        <div class="d-flex w-50 align-items-center">
          <div class="w-50">
            <app-datepicker
              *ngIf="type === 'date'"
              [label]="'Start ' + label"
              [inputFormControl]="startOfMonthFormControl"
            >
            </app-datepicker>
          </div>
          <span class="between-separator">
            and
          </span>
          <div class="w-50">
            <app-datepicker
              *ngIf="type === 'date'"
              [label]="'End ' + label"
              [inputFormControl]="endOfTodayFormControl"
            >
            </app-datepicker>
          </div>
        </div>

        <div class="ms-2 w-50">
          <app-select
            label="Operation"
            [inputFormControl]="parentForm | formGet : fieldName + '.operation'"
            [options]="type | operations: false"
            [optionsDisplayArray]="type | operations: true"
            [addEmptyOption]="true"
          ></app-select>
        </div>
      </div>
    } @else {
      <app-user-autocomplete
        *ngIf="type === 'users'"
        class="w-50"
        optionValueKey="id"
        [label]="label"
        [multiple]="true"
        [inputFormControl]="parentForm | formGet : fieldName + '.value'"
      ></app-user-autocomplete>
      <app-datepicker
        *ngIf="type === 'date'"
        class="w-50"
        [label]="label"
        [inputFormControl]="parentForm | formGet : fieldName + '.value'"
      >
      </app-datepicker>
      <app-autocomlete
        *ngIf="type === 'list'"
        class="w-50"
        [multiple]="multiple"
        [label]="label"
        [inputFormControl]="parentForm | formGet : fieldName + '.value'"
        [options]="options"
        [optionValueKey]="optionValueKey"
        [optionFilterKey]="optionFilterKey"
        [optionDisplayKey]="optionDisplayKey"
      >
      </app-autocomlete>
      <app-select
        class="ms-2 w-50"
        label="Operation"
        [inputFormControl]="parentForm | formGet : fieldName + '.operation'"
        [options]="type | operations: false"
        [optionsDisplayArray]="type | operations: true"
        [addEmptyOption]="true"
      ></app-select>
    }
  </div>
</ng-template>

<ng-template #resetButton>
  <app-button
    matButtonType="iconButton"
    icon="restart_alt"
    color="accent"
    tooltip="Reset filter"
    (clicked)="resetFilter()"
  ></app-button>
</ng-template>
