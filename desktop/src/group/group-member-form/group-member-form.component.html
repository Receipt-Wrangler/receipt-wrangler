<app-dialog [headerText]="headerText">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="d-flex">
      <app-user-autocomplete
        class="me-2"
        label="User"
        [inputFormControl]="form | formGet : 'userId'"
        [usersToOmit]="usersToOmit"
      ></app-user-autocomplete>
      <app-select
        class="me-1 flex-grow-1"
        label="Role"
        optionValueKey="id"
        optionDisplayKey="name"
        [options]="groupRoleOptions()"
        [inputFormControl]="form | formGet : 'groupRoleId'"
      ></app-select>
      <app-button
        data-testid="role-preview"
        matButtonType="iconButton"
        icon="visibility"
        color="accent"
        tooltip="Preview role"
        [disabled]="!selectedRole()"
        (clicked)="previewRole()"
      ></app-button>
    </div>

    @if (grantsReady() && grantRow(); as row) {
      <!-- Grants have their own group-scoped permission, separate from the
           group.members.update that opens this dialog, and the endpoint allows no
           app-level bypass — so a roster manager without it must not see editable
           controls that only produce a rejected request. -->
      <div
        class="group-member-form__grants"
        data-testid="member-grant-section"
        *hasGroupPermission="{
          groupId: row.groupId,
          permission: Permission.GroupMembersGrantsUpdate
        }"
      >
        <h3 class="group-member-form__grants-header">Category &amp; tag access</h3>
        <div class="hint hint-inline" data-testid="member-grant-hint">
          Limit this member to specific categories and tags. This narrows within what
          their group role already allows — it can never widen it.
          {{ emptySelectionHint(row) }}
          Saved immediately when you save this member.
        </div>
        <app-grant-picker
          [categoryPool]="categoryPool()"
          [tagPool]="tagPool()"
          [selectedCategoryIds]="row.current.categoryIds"
          [selectedTagIds]="row.current.tagIds"
          [ceiling]="row.ceiling"
          (grantsChange)="onGrantsChange(row.groupId, $event)"
        ></app-grant-picker>
      </div>
    }

    <app-dialog-footer (cancelClicked)="closeModal()"></app-dialog-footer>
  </form>
</app-dialog>
