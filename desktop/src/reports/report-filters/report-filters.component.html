@for (def of activeFields(); track def.field) {
  <div class="report-filter__row">
    @if (operationValueOf(def.field) === FilterOperation.Between) {
      <div class="report-filter__between">
        <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="report-filter__grow"
          [isCurrency]="!!def.isCurrency" [label]="'Start ' + def.label"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.0'"></app-input>
        <app-datepicker *ngIf="def.type === 'date'" class="report-filter__grow"
          [label]="'Start ' + def.label"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.0'"></app-datepicker>
        <span class="report-filter__sep">and</span>
        <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="report-filter__grow"
          [isCurrency]="!!def.isCurrency" [label]="'End ' + def.label"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.1'"></app-input>
        <app-datepicker *ngIf="def.type === 'date'" class="report-filter__grow"
          [label]="'End ' + def.label"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.1'"></app-datepicker>
      </div>
    } @else {
      <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="report-filter__value"
        [isCurrency]="!!def.isCurrency" [label]="def.label"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-input>
      <app-datepicker *ngIf="def.type === 'date'" class="report-filter__value"
        [label]="def.label"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-datepicker>
      <app-user-autocomplete *ngIf="def.type === 'users'" class="report-filter__value"
        optionValueKey="id" [label]="def.label" [multiple]="true"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-user-autocomplete>
      <app-autocomlete *ngIf="def.type === 'list'" class="report-filter__value"
        [label]="def.label" [multiple]="true"
        [options]="optionsFor(def)"
        [optionValueKey]="def.optionValueKey ?? ''"
        [optionFilterKey]="def.optionFilterKey ?? ''"
        [optionDisplayKey]="def.optionDisplayKey ?? ''"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-autocomlete>
    }

    <app-select class="report-filter__op" label="Operation" [addEmptyOption]="true"
      [options]="operationOptions(def.type)" [optionsDisplayArray]="operationDisplay(def.type)"
      [inputFormControl]="filterGroup | formGet: def.field + '.operation'"></app-select>

    <app-button matButtonType="iconButton" icon="close" color="warn" tooltip="Remove filter"
      (clicked)="removeFilter(def.field)" data-testid="report-filter-remove"></app-button>
  </div>
}

@if (addableFields().length > 0) {
  <select class="report-filter__add" #addSelect (change)="addFilter(addSelect.value); addSelect.value = ''">
    <option value="">Add filter…</option>
    @for (def of addableFields(); track def.field) {
      <option [value]="def.field">{{ def.label }}</option>
    }
  </select>
}
