<div class="d-flex flex-column">
  <app-table-header headerText="Users">
    <div class="d-flex gap-2">
      <ng-container *hasAppPermission="Permission.AppUsersDelete">
        <app-button
          *ngIf="hasSelectedUsers"
          buttonText="Delete Selected"
          color="warn"
          icon="delete"
          (clicked)="bulkDeleteUsers()"
        ></app-button>
      </ng-container>
      <app-button
        *hasAppPermission="Permission.AppUsersCreate"
        buttonText="Create User"
        (clicked)="openUserFormDialog()"
      ></app-button>
    </div>
  </app-table-header>
  <div class="table-container">
    <app-table
      [dataSource]="dataSource()"
      [columns]="columns"
      [displayedColumns]="displayedColumns"
      [selectionCheckboxes]="true"
    ></app-table>
  </div>
</div>

<ng-template #usernameCell let-element="element">
  {{ element.username }}
</ng-template>

<ng-template #displayNameCell let-element="element">
  {{ element.displayName }}
</ng-template>

<ng-template #appRoleCell let-element="element">
  {{ element.appRoleId | roleName : roles() }}
</ng-template>

<ng-template #createdAtCell let-element="element">
  {{ element.createdAt | date : "short" }}
</ng-template>

<ng-template #updatedAtCell let-element="element">
  {{ element.updatedAt | date : "short" }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <div class="d-flex align-items-center">
    <app-button
      *hasAppPermission="Permission.AppUsersUpdate"
      matButtonType="iconButton"
      icon="edit"
      tooltip="Edit User"
      color="accent"
      (clicked)="openUserFormDialog(element)"
    ></app-button>
    <app-button
      *hasAppPermission="Permission.AppUsersUpdate"
      matButtonType="iconButton"
      icon="password"
      tooltip="Set password"
      color="accent"
      (clicked)="openResetPasswordDialog(element)"
    ></app-button>
    <ng-container *hasAppPermission="Permission.AppUsersUpdate">
      <app-button
        *ngIf="element.isDummyUser"
        matButtonType="iconButton"
        icon="person"
        color="accent"
        tooltip="Convert to normal user"
        (clicked)="openDummyUserConversionDialog(element)"
      >
      </app-button>
    </ng-container>
    <ng-container *hasAppPermission="Permission.AppUsersDelete">
      <app-delete-button
        *ngIf="userId() !== element.id.toString()"
        data-testid="user-delete"
        (clicked)="deleteUser(index)"
      ></app-delete-button>
    </ng-container>
  </div>
</ng-template>
