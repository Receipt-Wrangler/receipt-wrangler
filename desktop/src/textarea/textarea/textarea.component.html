<!-- See app-input: a wrapping hint overflows Material's fixed subscript. -->
<mat-form-field
  class="w-100"
  [subscriptSizing]="hint ? 'dynamic' : 'fixed'"
>
  <mat-label>{{ label }}</mat-label>
  <textarea
    #nativeTextarea
    cdkTextareaAutosize
    matInput
    id="textarea"
    [placeholder]="placeholder ?? ''"
    [readonly]="readonly"
    [formControl]="inputFormControl"
    [matAutocomplete]="auto"
    [matAutocompleteDisabled]="true"
    (selectionchange)="onSelectionChange()"
  ></textarea>
  @if (hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }

  <mat-autocomplete
    #auto="matAutocomplete"
    [hideSingleSelectionIndicator]="true"
    (optionSelected)="onOptionSelected()"
  >
    @for (option of filteredOptions; track option) {
      <mat-option [value]="getOptionValue(option)">
        {{ option }}
      </mat-option>
    }
  </mat-autocomplete>

  @for (err of formControlErrors | async; track err) {
    <mat-error>{{
        err.message
      }}
    </mat-error>
  }
</mat-form-field>
