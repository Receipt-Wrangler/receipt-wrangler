<div class="d-flex">
  <mat-form-field [appearance]="appearance()" class="w-100">
    <mat-label>{{ label }}</mat-label>
    <div class="d-flex align-items-center">
      <input
        #nativeInput
        matInput
        [id]="inputId()"
        [type]="type"
        [readonly]="readonly"
        [formControl]="inputFormControl"
        [prefix]="maskPrefix"
        [suffix]="maskSuffix"
        [mask]="mask"
        [decimalMarker]="decimalMarker"
        [thousandSeparator]="thousandSeparator"
        [allowNegativeNumbers]="true"
        (blur)="inputBlur.emit($event)"
      />
    </div>
    <mat-error *ngFor="let err of formControlErrors | async">{{
        err.message
      }}
    </mat-error>
    <div matSuffix *ngIf="showVisibilityEye || showGeneratePassword">
      <button
        *ngIf="showGeneratePassword"
        class="generate-password-button"
        mat-icon-button
        type="button"
        data-testid="password-generate"
        aria-label="Generate password"
        matTooltip="Generate password"
        [disabled]="inputFormControl.disabled || readonly"
        (click)="generatePassword()"
      >
        <mat-icon>autorenew</mat-icon>
      </button>
      <button
        *ngIf="showVisibilityEye"
        class="visibility-eye-button"
        mat-icon-button
        type="button"
        [matTooltip]="type === 'password' ? 'Show ' + label : 'Hide ' + label"
        (click)="toggleVisibility()"
      >
        <mat-icon *ngIf="type === 'password'">visibility</mat-icon>
        <mat-icon *ngIf="type !== 'password'">visibility_off</mat-icon>
      </button>
    </div>
    @if (hint) {
      <mat-hint>
        {{ hint }}
      </mat-hint>
    }
  </mat-form-field>
</div>
